<!DOCTYPE html>
<html lang="ar" dir="rtl">
<title>إتصل بنا</title>

<head>
  <div data-html-src="layout/head.html"></div>
  <link rel="stylesheet" href="./assets/css/main.css">
  <style>
    .contact-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .contact-wrapper iframe {
      flex: 1 1 500px;
      max-width: 100%;
      height: 100%;
      min-height: 350px;
      border: 0;
    }

    .contact-desc {
      flex: 1 1 300px;
    }

    @media (max-width: 768px) {
      .contact-wrapper {
        flex-direction: column;
      }

      .contact-wrapper iframe {
        width: 100%;
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <div data-html-src="layout/header.html"></div>

  <section class="contact default_section__">
    <div class="container">
      <div class="section_head_wrapper center popular_head">
        <h3 class="section_main_title__">إتصل بنا</h3>
        <h4 class="section_sub_title__">يمكنك التواصل معنا من خلال الموقع التالي:</h4>
      </div>

      <div class="contact-wrapper">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d41074.286632192765!2d46.726679890929624!3d24.50317956736134!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e2f03890d489399%3A0xba974d1c98e79fd5!2z2KfZhNix2YrYp9i2INin2YTYs9i52YjYr9mK2Kk!5e0!3m2!1sar!2seg!4v1745566294017!5m2!1sar!2seg"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <div class="contact-desc">
          <div class="link__ contact-box">
            <figure class="figure__ loading-omd contact-figure">
              <img class="img-om lazy-omd" data-src="assets/images/contact/location.png" alt="">
            </figure>
            <p class="parg">الرياض</p>
          </div>

          <div class="link__ contact-box">
            <figure class="figure__ loading-omd contact-figure">
              <img class="img-om lazy-omd" data-src="assets/images/contact/clock.png" alt="">
            </figure>
            <p class="parg">عدد ساعات العمل 8 ساعات يوميًا (9 AM - 4 PM)</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div data-html-src="layout/footer.html"></div>
  <script src="assets/js/jquery-3.3.1.min.js"></script>
  <div data-html-src="layout/scripts.html"></div>
  <script src="assets/js/loader.js"></script>
</body>

</html>
